aid: biofourmis
name: Biofourmis
description: 'Biofourmis is a health technology company founded in 2015, with offices
  in Boston, Singapore and India, that partners with health systems, hospitals, payers
  and life science companies to deliver care in the home. Its platform combines medical-grade
  device connectivity, FDA-cleared algorithms and digital biomarkers, a patient mobile
  app and clinician dashboard, and 70+ dynamic care pathways to support Hospital at
  Home, Timely Discharge, SNF at Home and Remote Patient Monitoring programs. Biofourmis
  merged with CopilotIQ in October 2024 to form an end-to-end platform for AI-driven
  in-home care; ActiGraph acquired the Biofourmis life science business in January
  2025. The company markets EMR integration and device-agnostic connectivity to enterprise
  healthcare customers, but publishes no public developer program, API reference or
  machine-readable API contract.'
